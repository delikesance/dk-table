# Dev container: repo mounted at /workspace, cached cargo registry + node_modules.
services:
  dev:
    build: .
    working_dir: /workspace
    command: bash
    stdin_open: true
    tty: true
    ports:
      - "1420:1420" # Vite dev server
    volumes:
      - .:/workspace
      - cargo-registry:/home/node/.cargo/registry
      - node-modules:/workspace/node_modules

volumes:
  cargo-registry:
  node-modules:
