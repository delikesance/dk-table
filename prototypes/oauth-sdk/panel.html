<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boucle</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/theme/theme-dark.css">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/panel.css">
</head>
<body>
<nav class="topnav" aria-label="Pages">
  <b>dk-table</b>
  <a href="/" aria-current="page">Boucle</a>
  <a href="/moodboard.html">Moodboard</a>
  <a href="/design.html">Design</a>
</nav>
<div class="wrap">
  <aside id="control" class="box">
    <h2>Contrôle</h2>
    <button id="run" type="button" data-state="idle">Go</button>
    <div class="field">
      <label for="budgetEur">Budget</label>
      <input id="budgetEur" type="number" min="0.5" max="100" step="0.5" value="20">
      <span>€</span>
    </div>
    <div id="budget">
      <div id="gauge" role="progressbar" aria-label="Budget dépensé" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
      <div id="amounts"></div>
    </div>
    <p id="status" role="status" aria-live="polite">Prêt.</p>
    <p id="conn" role="status" hidden>Connexion perdue, reprise automatique…</p>
  </aside>
  <main>
    <div id="alert" role="alert" hidden></div>
    <section id="summary" class="box" aria-live="polite">
      <p id="now" hidden></p>
      <p id="idle">Go lance 4 phases dans l'ordre : recherche, implémentation, correction, design. Elles s'arrêtent au plafond du budget.</p>
      <div id="phase-label"></div>
      <p id="latest" hidden></p>
      <details id="history" hidden><summary>Résumés précédents</summary><div id="hist"></div></details>
    </section>
    <section class="box"><h2>Phases</h2><ol id="phasebar"></ol></section>
    <section id="journal" class="box">
      <div class="jbar">
        <h2>Journal</h2>
        <label><input id="onlyErr" type="checkbox"> Erreurs seulement</label>
      </div>
      <ul id="log"></ul>
    </section>
  </main>
</div>
<script src="/panel.js"></script>
</body>
</html>
