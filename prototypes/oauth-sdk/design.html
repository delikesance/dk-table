<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design</title>
<link rel="stylesheet" href="/panel.css">
<link rel="stylesheet" href="/design-view.css">
</head>
<body class="dz">
<nav class="topnav" aria-label="Pages"><b>dk-table</b><a href="/">Boucle</a><a href="/moodboard.html">Moodboard</a><a href="/design.html" aria-current="page">Design</a></nav>
<aside><h1>Étapes du designer</h1><ol id="timeline"></ol></aside>
<main>
  <div class="bar" role="toolbar" aria-label="Toile">
    <label for="history" class="lbl">Historique</label><select id="history"></select>
    <select id="history2" aria-label="Design comparé" hidden></select>
    <span class="grp" role="group" aria-label="Largeur">
      <button type="button" data-vp="390">Mobile</button><button type="button" data-vp="820">Tablette</button>
      <button type="button" data-vp="1200">Bureau</button><button type="button" data-vp="1600">Large</button>
      <button type="button" data-vp="0" aria-pressed="true">Libre</button>
    </span>
    <select id="zoom" aria-label="Zoom"><option value="fit">Ajusté</option><option value="1">100 %</option><option value="0.75">75 %</option><option value="0.5">50 %</option></select>
    <span class="grp" role="group" aria-label="Thème du design">
      <button type="button" data-theme-set="auto" aria-pressed="true">Auto</button><button type="button" data-theme-set="light">Clair</button><button type="button" data-theme-set="dark">Sombre</button>
    </span>
    <button type="button" id="pause" aria-pressed="false">Pause</button>
    <button type="button" id="reload">Relancer</button>
    <button type="button" id="compare" aria-pressed="false">Comparer</button>
  </div>
  <div id="viewer"></div>
  <details id="errors-box"><summary>Erreurs du design <b id="err-count">0</b></summary><ul id="errors"></ul></details>
  <div id="thumbs" role="list"></div>
</main>
<script src="/design-view.js"></script>
</body>
</html>
