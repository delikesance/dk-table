<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodboard</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/panel.css">
<link rel="stylesheet" href="/moodboard-view.css">
</head>
<body>
<nav class="topnav" aria-label="Pages"><b>dk-table</b><a href="/">Boucle</a><a href="/moodboard.html" aria-current="page">Moodboard</a><a href="/design.html">Design</a></nav>
<header class="mb-head">
  <h1>Moodboard</h1>
  <p id="progress" role="status" aria-live="polite"></p>
  <div class="counters" id="counters"></div>
  <input id="q" type="search" placeholder="Rechercher une carte" aria-label="Rechercher une carte">
  <div class="filters" id="filters" role="group" aria-label="Filtre par axe"></div>
</header>
<main id="board">
  <section class="col"><h2>Idées</h2><div class="cards" id="col-idee"></div></section>
  <section class="col"><h2>En cours</h2><div class="cards" id="col-en-cours"></div></section>
  <section class="col"><h2>Preuves</h2><div class="cards" id="col-preuves"></div></section>
  <section class="col"><h2>Terminées</h2><div class="cards" id="col-termine"></div></section>
</main>
<aside id="drawer" hidden aria-label="Rapport de la carte"></aside>
<script src="/moodboard-view.js"></script>
</body>
</html>
