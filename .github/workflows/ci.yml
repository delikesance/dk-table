# CI rapide : tout push sur une branche autre que `master` (une PR vers développement a déjà ses pushs).
# Objectif < 1-2 min : types + tests des fichiers modifiés seulement.
# Les gros tests (vitest complet, e2e, Rust, builds) sont dans ci-full.yml (vers/sur master).
name: CI

on:
  push:
    branches-ignore: [master]

# Un nouveau push annule le run précédent de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # Deux commits : HEAD~1 sert de base à --changed (suffit pour un push ou un merge).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci --no-audit --no-fund --prefer-offline

      - name: Types
        run: npx tsc --noEmit

      # Seuls les tests liés aux fichiers modifiés ; la suite complète tourne vers master.
      - name: Tests des fichiers modifiés
        run: npx vitest run --changed HEAD~1 --passWithNoTests
