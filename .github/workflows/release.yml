# Release: à chaque merge sur `master` (ex. développement -> master), build Linux
# (deb + AppImage) et Windows (msi + nsis), puis publication d'une release v<version>.
name: Release

on:
  push:
    branches: [master]

# Un seul run de release par ref ; un push plus récent n'interrompt pas une publication en cours.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev xdg-utils file

      - run: npm ci

      - name: Build deb + AppImage
        run: npx tauri build --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: dk-table-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build msi + nsis
        run: npx tauri build --bundles msi,nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: dk-table-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi.sig

  # Publie la release v<version> (version de tauri.conf.json) avec les installeurs.
  # Échoue si le tag existe déjà : incrémenter la version avant de fusionner dans master.
  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      # latest.json: lu par l'updater de l'app (signatures des installeurs, URLs de la release).
      - name: Generate latest.json
        run: |
          cat > make-latest.cjs <<'JS'
          const fs = require("fs"), path = require("path");
          const version = require("./src-tauri/tauri.conf.json").version;
          const files = fs.readdirSync("dist", { recursive: true }).map(String);
          const pick = (re) => {
            const f = files.find((x) => re.test(x));
            if (!f) throw new Error("introuvable: " + re);
            return path.basename(f);
          };
          const entry = (installer) => ({
            signature: fs.readFileSync(path.join("dist", files.find((x) => path.basename(x) === installer + ".sig")), "utf8").trim(),
            url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}/${installer}`,
          });
          const platforms = {
            "linux-x86_64": entry(pick(/\.AppImage$/)),
            "windows-x86_64": entry(pick(/-setup\.exe$/)),
          };
          fs.writeFileSync("latest.json", JSON.stringify({ version, notes: "", pub_date: new Date().toISOString(), platforms }, null, 2));
          JS
          node make-latest.cjs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release create "v${version}" $(find dist -type f) latest.json \
            --target "${GITHUB_SHA}" \
            --title "dk-table v${version}" \
            --generate-notes
